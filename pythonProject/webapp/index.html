<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>BeerMarket News</title>
  <link id="app-styles" rel="stylesheet" href="./css/styles.css"/>
  <script>
    (function forceFreshAssets() {
      try {
        var styles = document.getElementById("app-styles");
        if (styles) {
          var href = styles.getAttribute("href") || "./css/styles.css";
          styles.setAttribute("href", href + "?_ts=" + Date.now());
        }
      } catch (_) {}
    })();
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="header-content">
      <h1>🍺 Новости BeerMarket</h1>
      <p id="status" class="status-badge">Загрузка...</p>
      <button id="syncNow" class="sync-now">Обновить пенную ленту</button>
    </div>
  </header>
  <main>
    <section id="feed" class="feed"></section>
    <button id="loadMore" class="load-more">Налить ещё новостей</button>
  </main>
  <template id="news-card-template">
    <article class="card">
      <div class="card-meta"></div>
      <h2 class="card-title"></h2>
      <p class="card-text"></p>
      <div class="carousel"></div>
    </article>
  </template>
  <script type="module" src="./js/app.js?"></script>
</body>
</html>
